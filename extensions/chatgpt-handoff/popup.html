<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tab Web AI</title>
  <style>
    :root { color-scheme: dark; font: 13px system-ui, sans-serif; background: #171512; color: #f4eee8; }
    body { width: 320px; margin: 0; padding: 16px; box-sizing: border-box; }
    h1 { margin: 0 0 10px; font-size: 16px; }
    p { color: #c2b8ad; line-height: 1.5; }
    label { display: block; margin-bottom: 7px; }
    select, button { width: 100%; box-sizing: border-box; min-height: 36px; border: 1px solid #51463c; border-radius: 9px; padding: 8px; background: #252019; color: inherit; font: inherit; }
    button { margin-top: 9px; cursor: pointer; }
    button.primary { background: #ff5a32; color: #1a120d; border-color: #ff5a32; font-weight: 600; }
    button:disabled { opacity: .5; cursor: default; }
    select:focus-visible, button:focus-visible { outline: 2px solid #ff9c7e; outline-offset: 2px; }
    #status { margin-bottom: 0; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Tab AI cho Studio</h1>
  <label for="provider">Website</label>
  <select id="provider"><option value="chatgpt-web">ChatGPT</option><option value="gemini">Gemini</option><option value="muse">Muse</option></select>
  <label for="tabs">Chọn cuộc trò chuyện đang mở</label>
  <select id="tabs" aria-describedby="status"></select>
  <button id="select" class="primary" type="button">Liên kết tab đã chọn</button>
  <button id="forget" type="button">Ngắt liên kết</button>
  <p>Một tab phù hợp: Studio tự nối. Có nhiều tab: chọn một lần tại đây, rồi bấm Phân tích trong Studio.</p>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="popup.js"></script>
</body>
</html>
